<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marce Brillo y Estilo — Ingresar</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="brand">Marce Brillo y Estilo</h1>
      <p class="slogan">Calzado y Accesorios que te harán brillar</p>
      <div class="login-error" id="loginError"></div>
      <form id="loginForm">
        <div class="field" style="text-align:left">
          <label for="username">Usuario</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field" style="text-align:left">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Ingresar</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorBox.textContent = data.error || 'No se pudo iniciar sesión';
          errorBox.style.display = 'block';
          return;
        }
        window.location.href = '/index.html';
      } catch (err) {
        errorBox.textContent = 'Error de conexión. Intenta de nuevo.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
